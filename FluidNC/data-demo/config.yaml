name: "Demo"
board: "ESP32v4"
meta: "machine=MILL"

stepping:
  engine: I2S_STATIC
  idle_ms: 250
  dir_delay_us: 1
  pulse_us: 6
  disable_delay_us: 0

start:
  check_limits: true
  must_home: false
  deactivate_parking: false

uart1:
  txd_pin: gpio.26
  rxd_pin: gpio.25
  baud: 1000000
  mode: 8N1

uart_channel1:
   uart_num: 1
   report_interval_ms: 75
   message_level: info

control:
  safety_door_pin: NO_PIN

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
 cs_pin: gpio.5
 card_detect_pin: NO_PIN
 frequency_hz: 8000000

vspi:
  miso_pin: gpio.21
  mosi_pin: gpio.22
  sck_pin: gpio.17

w5500:
 cs_pin: gpio.16
 interrupt_pin:  gpio.15
 ip: 192.168.2.2
 gateway: 192.168.2.1
 netmask: 255.255.255.0

# i2c0:
#   sda_pin: gpio.22
#   scl_pin: gpio.21

#oled:
#  type: "SH1106"
#  width: 128
#  height: 64
#  i2c_num: 0
#  i2c_address: 60
#  radio_delay_ms: 1000

#synchro:
#  index_pin: gpio.26

i2so:
  data_pin: gpio.13
  ws_pin: gpio.14
  bck_pin: gpio.27

coolant:
    flood_pin: i2so.7
    mist_pin: i2so.8
    delay_ms: 0

# pwm:
#   pwm_hz: 5000
#   direction_pin: i2so.9
#   output_pin: gpio.14
#   enable_pin: NO_PIN
#   disable_with_s0: false
#   s0_with_disable: true
#   spinup_ms: 0
#   spindown_ms: 0
#   tool_num: 0
#   speed_map: 0=0.000% 1000=100.000%
#   off_on_alarm: false
#   atc: atc_tool_table
#   M6_macro:

# atc_tool_table:

axes:

  x:
    steps_per_mm: 500
    max_rate_mm_per_min: 1500.0
    acceleration_mm_per_sec2: 500
    max_travel_mm: 1000
    homing:
      mpos_mm: 0.0
      positive_direction: true
    motor0:
      limit_neg_pin: gpio.12
#      limit_pos_pin: gpio.35
      hard_limits: true
      stepstick:
        step_pin: i2so.0
        direction_pin: i2so.1
    mpg:
      a_pin: gpio.32
      b_pin: gpio.33
      reverse: false
      pulses_per_rev: 1000
      max_rpm: 250.0
      max_rate_factor: 0.75

  y:
    steps_per_mm: 500
    max_rate_mm_per_min: 1500.0
    acceleration_mm_per_sec2: 500
    max_travel_mm: 1000
    homing:
      mpos_mm: 0.0
      positive_direction: false

  z:
    steps_per_mm: 500
    max_rate_mm_per_min: 1500.0
    acceleration_mm_per_sec2: 500
    max_travel_mm: 1000
