name: "Epoxy Granite Mill"
board: "ESP32v4"
meta: "machine:MILL"

start:
  check_limits: true
  must_home: false
  deactivate_parking: false

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.18
  sck_pin: gpio.5

sdcard:
  cs_pin: gpio.17
  card_detect_pin: NO_PIN
  frequency_hz: 8000000

uart1:
  txd_pin: gpio.16
  rxd_pin: gpio.4
  baud: 1000000
  mode: 8N1

uart_channel1:
   uart_num: 1
   report_interval_ms: 75
   message_level: info

control:
  safety_door_pin: NO_PIN
  fault_pin: uart_channel1.5:pu:low

atc_tool_table:

