i2so:
  data_pin: gpio.0
  ws_pin: gpio.2
  bck_pin: gpio.15

stepping:
  engine: I2S_STATIC
  idle_ms: 10000
  dir_delay_us: 1
  pulse_us: 6
  disable_delay_us: 0

vspi:
  miso_pin: gpio.13
  mosi_pin: gpio.14
  sck_pin: gpio.27

w5500:
 cs_pin: gpio.26
 interrupt_pin: gpio.25
 ip: 192.168.2.2
 gateway: 192.168.2.1
 netmask: 255.255.255.0

axes:

  x:
    steps_per_mm: 500
    max_rate_mm_per_min: 4000
    acceleration_mm_per_sec2: 400
    max_travel_mm: 1000
    homing:
      mpos_mm: 0.0
      positive_direction: false
    motor0:
      limit_neg_pin: uart_channel1.3:pu:low
      limit_pos_pin: uart_channel1.4:pu:low
      hard_limits: true
      stepstick:
        step_pin: i2so.4
        direction_pin: i2so.5:low
    mpg:
      a_pin: gpio.36
      b_pin: gpio.39
      reverse: false
      pulses_per_rev: 500
      max_rpm: 240.0
      max_rate_factor: 0.5


  y:
    steps_per_mm: 400
    max_rate_mm_per_min: 4000
    acceleration_mm_per_sec2: 400
    max_travel_mm: 1000
    homing:
      mpos_mm: 0.0
      positive_direction: false
    motor0:
      limit_neg_pin: uart_channel1.6:pu:low
      limit_pos_pin: uart_channel1.7:pu:low
      hard_limits: true
      stepstick:
        step_pin: i2so.2
        direction_pin: i2so.3:low
    mpg:
      a_pin: gpio.34
      b_pin: gpio.35
      reverse: true
      pulses_per_rev: 500
      max_rpm: 240.0
      max_rate_factor: 0.5


  z:
    steps_per_mm: 314.96
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 400
    max_travel_mm: 1000
    homing:
      mpos_mm: 0.0
      positive_direction: true
    motor0:
      limit_neg_pin: uart_channel1.8:pu:low
      limit_pos_pin: uart_channel1.9:pu:low
      hard_limits: true
      stepstick:
        step_pin: i2so.0
        direction_pin: i2so.1
    mpg:
      a_pin: gpio.32
      b_pin: gpio.33
      reverse: true
      pulses_per_rev: 500
      max_rpm: 240.0
      max_rate_factor: 0.5
